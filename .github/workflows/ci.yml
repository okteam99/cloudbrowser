name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm run format:check
      - run: npm test
      - run: npm run schema && git diff --exit-code docs/mcp-tools.json
      - run: docker build -t cloudbrowser:0.12.0 .
      - run: docker run -d --init --name cloudbrowser --shm-size=1g -p 8080:8080 -e BASE_URL=http://localhost:8080 -e WEB_PASSWORD=ci-test-password cloudbrowser:0.12.0
      - run: npm run smoke -- --docker
      - run: SMOKE_BASE_URL=http://localhost:8080 SMOKE_PASSWORD=ci-test-password npm run smoke:http
      - if: always()
        run: docker logs cloudbrowser || true
      - if: always()
        run: docker rm -f cloudbrowser || true
